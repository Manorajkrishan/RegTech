name: RegTech checks
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Check initial database migration on a clean database
        run: |
          DB_URL=sqlite+aiosqlite:///./regtech-ci-migrations.sqlite3 python -m alembic upgrade head
          DB_URL=sqlite+aiosqlite:///./regtech-ci-migrations.sqlite3 python -m alembic current
          DB_URL=sqlite+aiosqlite:///./regtech-ci-migrations.sqlite3 python -m alembic check
      - run: python -m pytest -q
  local-staging-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate private Docker Compose configuration
        env:
          REGTECH_DB_PASSWORD: ci-only-placeholder-password
          REGTECH_SECRET_KEY: ci-only-placeholder-key
        run: docker compose -f docker-compose.yml config --quiet

  integrated-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGTECH_DB_PASSWORD: local-ci-database-placeholder
      REGTECH_SECRET_KEY: local-ci-application-placeholder-with-sufficient-length
    steps:
      - uses: actions/checkout@v4
      - name: Build and start localhost-only stack
        run: docker compose up --build --detach
      - name: Wait for API and web to respond
        run: |
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 4
          done
          docker compose ps
          exit 1
      - name: Smoke-test real backend and frontend
        run: python3 backend/scripts/smoke_local_stack.py
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --tail=120 --no-color
      - name: Tear down (isolated ephemeral test data)
        if: always()
        run: docker compose down --volumes

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGTECH_DB_PASSWORD: ci-playwright-only-password
      REGTECH_SECRET_KEY: ci-playwright-placeholder-with-sufficient-length
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner without changing production lockfile
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Build and start private local stack
        run: docker compose up --build --detach
      - name: Wait for app readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          exit 1
      - name: Run real Chromium end-to-end tests
        working-directory: frontend
        run: npx playwright test --config=playwright.config.ts
      - name: Upload browser test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regtech-browser-e2e-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100 --no-color
      - name: Remove all synthetic test data
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
